name: Publish the site and daily stories

on:
  schedule:
    # 22:00 Moscow time (19:00 UTC), after the daily channel posts.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      story_date:
        description: 'Moscow date (YYYY-MM-DD). Leave blank for today.'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3
      - name: Build the approved homepage
        run: |
          python build_stories.py dist "$STORY_DATE"
          for page in index stories about book materials delegation price-objection; do
            test -s "dist/$page.html"
          done
        env:
          STORY_DATE: ${{ inputs.story_date }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Allow the Pages artifact to become visible
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deploy

<template data-page="delegation" data-nav="materials" data-title="Как делегировать задачу" data-description="Как объяснить результат, передать полномочия и договориться о контрольной точке. Три вопроса сотруднику.">
  <main class="shell subpage guide">
    <a class="text-link" href="materials.html">← Все материалы</a>
    <h1>Как делегировать задачу, чтобы она не вернулась к вам</h1>
    <p class="lead">Вы поручили сотруднику работу. Через час он спрашивает, кому звонить, завтра — что согласовывать, а к пятнице вы заканчиваете всё сами. Знакомо?</p>
    <p>Перед началом работы договоритесь о результате, пределах полномочий и моменте, когда вы вместе посмотрите, что получается. Тогда сотрудник будет знать, какие решения он принимает сам и в какой ситуации нужна ваша помощь.</p>
    <h2>Как это может звучать</h2>
    <blockquote>К пятнице подготовь сравнение трёх вариантов поставки и предложи, какой выбрать. С поставщиками договариваешься сам. Если сроки выходят за пределы месяца, напиши сразу. В среду посмотрим, какие варианты уже есть.</blockquote>
    <h2>Три вопроса в конце разговора</h2>
    <ol>
      <li>Что будет готово к пятнице и в каком виде?</li>
      <li>Какие решения ты принимаешь самостоятельно?</li>
      <li>Что мы проверяем в среду и в каком случае ты напишешь раньше?</li>
    </ol>
    <p>Попросите сотрудника ответить своими словами. Вы сразу услышите, где он понял договорённость иначе, пока ещё можно спокойно её уточнить.</p>
    <p>Есть свой пример? Откройте пост о делегировании и поделитесь опытом в комментариях, если они доступны.</p>

<template data-page="price-objection" data-nav="materials" data-title="Что ответить клиенту на «дорого»" data-description="Три вопроса клиенту, чтобы разобраться в возражении о цене и сравнить предложения по существу.">
  <main class="shell subpage guide">
    <a class="text-link" href="materials.html">← Все материалы</a>
    <h1>Что ответить клиенту, когда он говорит «дорого»</h1>
    <p class="lead">Клиент говорит «дорого», а разговор продолжается. Спросите, что именно он сравнивает. За ценой может стоять бюджет, более дешёвое предложение или сомнение в результате.</p>
    <h2>Что меняется, когда цена становится понятнее</h2>
    <p>В одном эксперименте в столовой рядом с куриным супом по очереди ставили две таблички. На одной перечисляли ингредиенты. На второй показывали ещё и расходы на приготовление. Во втором случае доля покупавших суп выросла с 2,3 до 2,8%. В переговорах я бы начал с того, чтобы объяснить состав предложения. Клиенту проще сравнивать цены, когда понятно, что входит в каждую.</p>
    <p><a class="text-link" href="https://www.hbs.edu/ris/Publication%20Files/15-017_f67df7f5-8336-47fc-a0c1-098838aa550d.pdf">Исследование Harvard Business School ↗</a></p>
    <h2>Что спросить клиента</h2>
    <ol>
      <li>С чем сравниваете нашу цену?</li>
      <li>Что входит в оба предложения? Давайте сверим объём, сроки и условия.</li>
      <li>Если другой вариант дешевле, что пока удерживает вас от решения?</li>
    </ol>
    <p>Если дело в бюджете, обсудите другой объём. Если клиент сомневается в сроках или результате, поговорите о них. Так вы поймёте, какой вопрос нужно решить, прежде чем обсуждать скидку.</p>
    <p>Как вы отвечаете на «дорого»? Поделитесь в комментариях под постом, если они открыты.</p>
    <p><a class="text-link" href="https://t.me/sopov_praktika/411">Открыть пост о цене в Telegram ↗</a></p>
